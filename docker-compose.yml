services:
  postgres:
    container_name: postgres-cotiza360
    image: postgres:14
    environment:
      POSTGRES_USER: cotiza360_user
      POSTGRES_PASSWORD: tu_password_seguro
      POSTGRES_DB: cotiza360_db
      PGDATA: /data/postgres
    volumes:
      - postgres-cotiza360:/data/postgres
    ports:
      - '5432:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cotiza360_user -d cotiza360_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: cotiza360-api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://cotiza360_user:tu_password_seguro@postgres:5432/cotiza360_db?schema=public
      - NODE_ENV=development
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command: >
      sh -c "npm install && 
             npx prisma generate &&
             npm run start:dev"

volumes:
  postgres-cotiza360:
    name: postgres-cotiza360-data
